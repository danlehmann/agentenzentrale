{% extends "base.html" %}
{% block title %}Join — Agentenzentrale{% endblock %}
{% block body %}
<div class="auth-card">
  <h1 class="brand big">Agentenzentrale</h1>
  <p class="sub">You've been invited. Create your account.</p>
  {% if let Some(e) = error %}<div class="alert">{{ e }}</div>{% endif %}
  <form method="post" action="/invite/{{ token }}">
    <label>Username<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="new-password" required></label>
    <label>Confirm password<input type="password" name="password2" autocomplete="new-password" required></label>
    <button type="submit" class="primary">Create account</button>
  </form>
</div>
{% endblock %}
