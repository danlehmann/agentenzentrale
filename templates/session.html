{% extends "base.html" %}
{% block title %}{{ session_title }} — {{ worker.name }} — Q{% endblock %}
{% block body_attrs %}class="chat-page"{% endblock %}
{% block body %}
<div class="chat-frame">
  <header class="top">
    <span class="brand">Q</span>
    <nav>
      <a href="/w/{{ worker.id }}">← {{ worker.name }}</a>
      <span class="chat-title">{{ session_title }}</span>
      <form id="abort-form" method="post" action="/w/{{ worker.id }}/s/{{ session_id }}/abort" class="inline">
        <input type="hidden" name="_csrf" value="{{ csrf }}">
        <button class="danger link" type="submit">Abort</button>
      </form>
    </nav>
  </header>

  <div id="thread" class="chat-thread"
       hx-get="/w/{{ worker.id }}/s/{{ session_id }}/thread"
       hx-trigger="load once, every 2s"
       hx-swap="innerHTML">
    {{ thread|safe }}
  </div>

  <form class="composer"
        hx-post="/w/{{ worker.id }}/s/{{ session_id }}/message"
        hx-target="#thread"
        hx-swap="innerHTML"
        hx-disabled-elt="find button"
        hx-on::before-request="this.querySelector('#send-btn').disabled=true;this.querySelector('#send-status').textContent='sending…'"
        hx-on::after-request="this.querySelector('#prompt').value='';this.querySelector('#send-btn').disabled=false;this.querySelector('#send-status').textContent=''">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <textarea name="text" id="prompt" rows="2"
              placeholder="Message {{ worker.name }}… (drag a file to attach it)"></textarea>
    <div class="composer-row">
      <span id="drops" class="drops"></span>
      <span id="send-status" class="drops"></span>
      <button id="send-btn" class="primary" type="submit">Send</button>
    </div>
  </form>
</div>

<script src="/static/chat.js" defer></script>
{% endblock %}
