{% if let Some(e) = error %}
<div class="alert">{{ e }}</div>
{% endif %}
{% for m in messages %}
<div class="msg {{ m.role }}">
  <div class="who">{{ m.role }}</div>
  <div class="body">{{ m.html|safe }}</div>
</div>
{% else %}
<div class="empty">No messages yet. Ask something below.</div>
{% endfor %}
