{% extends "base.html" %}
{% block title %}Edit worker — Agentenzentrale{% endblock %}
{% block body %}
<header class="top">
  <span class="brand">Agentenzentrale</span>
  <nav>
    <a href="/">Workers</a>
    {% if is_admin %}<a href="/invites">Invites</a>{% endif %}
    <span class="user">{{ username }}</span>
    <form method="post" action="/logout" class="inline">
      <button class="link" type="submit">Sign out</button>
    </form>
  </nav>
</header>
<h1>Edit worker</h1>
{% if let Some(e) = error %}<div class="alert">{{ e }}</div>{% endif %}
<form method="post" action="/workers/{{ id }}/edit" class="stack">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <label>Display name<input name="name" required value="{{ name }}"></label>
  <label>Agent kind
    <select name="kind">
      <option value="opencode" {% if kind == "opencode" %}selected{% endif %}>opencode</option>
    </select>
  </label>
  <label>Server URL<input name="url" required value="{{ url }}"></label>
  <label>Server username<input name="username" value="{{ username_field }}"></label>
  <label>Server password
    <input type="password" name="password" placeholder="Leave blank to keep current">
    <small>Only fill this in to change the stored worker password.</small>
  </label>
  <div class="actions">
    <button type="submit" class="primary">Save changes</button>
    <a class="btn" href="/">Cancel</a>
  </div>
</form>
{% endblock %}
